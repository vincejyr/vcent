<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}: Writing" href="{{ '/feed/writing.xml' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}: Music reviews" href="{{ '/feed/music-reviews.xml' | relative_url }}">
  {% if site.posthog %}
  <link rel="preconnect" href="{{ site.posthog.host }}">
  <script>
    (function () {
      var script = document.createElement('script');
      script.async = true;
      script.src = {{ site.posthog.host | append: '/static/array.js' | jsonify }};
      script.onload = function () {
        window.posthog.init({{ site.posthog.project_token | jsonify }}, {
          api_host: {{ site.posthog.host | jsonify }},
          capture_exceptions: {
            capture_unhandled_errors: true,
            capture_unhandled_rejections: true,
            capture_console_errors: false
          },
          logs: {
            serviceName: 'vcent-web',
            environment: {{ jekyll.environment | jsonify }}
          }
        });

        if (window.posthog.logger && typeof window.posthog.logger.info === 'function') {
          window.posthog.logger.info('site_page_loaded');
        }
      };
      document.head.appendChild(script);
    })();
  </script>
  {% endif %}
  {% seo title=true %}
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
