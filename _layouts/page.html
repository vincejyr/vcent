---
layout: default
---
<div class="wrap">
  <header class="page-head">
    <div class="page-head-text">
      {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
    </div>
    {% if page.intro %}<p class="intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</div>
